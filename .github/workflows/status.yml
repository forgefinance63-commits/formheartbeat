name: status-check
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Run checks (expected vs actual)
        id: run
        run: python ci/run_status.py
        continue-on-error: true
      - name: Commit status back (keeps repo active)
        run: |
          git config user.name "formheartbeat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status docs
          git commit -m "status: ${{ github.event_name }} run ${{ github.run_id }}" || exit 0
          git pull --rebase -q && git push
      - name: Fail if expectations mismatched
        if: steps.run.outcome == 'failure'
        run: exit 1
