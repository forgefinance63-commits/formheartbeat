name = "formheartbeat"
main = "src/entry.js"
compatibility_date = "2026-10-01"
# Deployed to workers.dev (free plan). No paid features. workers_dev only, no custom routes.
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]  # free-plan-safe; no cadence promised

[vars]
ALERTS_ENABLED = "true"       # internal-test recipient only (forgefinance63@gmail.com)
EMAIL_PROVIDER = "brevo"      # or "resend" / "mailchannels"; disabled unless secret + ALERTS_ENABLED="true"

# Secrets (set with `wrangler secret put`, never in code):
#   API_KEYS              JSON {"<sha256 of api key>": "<account id>"}
#   BREVO_API_KEY (or RESEND_API_KEY / MAILCHANNELS_API_KEY), ALERT_FROM

[[kv_namespaces]]
binding = "KV"
id = "9d8920a193474051be0b711049b51e70"

# Self service binding: cron -> one invocation per account -> one invocation per site (own subrequest/CPU budget each).
[[services]]
binding = "RUNNER"
service = "formheartbeat"
entrypoint = "Runner"
