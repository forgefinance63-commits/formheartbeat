name = "formheartbeat"
main = "src/index.js"
compatibility_date = "2026-10-01"
# NOT DEPLOYED. Deployment waits for owner-provided Cloudflare API token.

[triggers]
crons = ["*/15 * * * *"]

[vars]
ALERTS_ENABLED = "false"      # email alerts off until owner approves
EMAIL_PROVIDER = "resend"     # or "mailchannels"

# Secrets (set with `wrangler secret put`, never in code):
#   API_KEYS              JSON {"<sha256 of api key>": "<account id>"}
#   RESEND_API_KEY / MAILCHANNELS_API_KEY, ALERT_FROM

# [[kv_namespaces]]
# binding = "KV"
# id = "<kv-namespace-id>"
